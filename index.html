<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#060612">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>SpendLens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0b0f0c;
  --surf: rgba(255,255,255,0.04);
  --surf2: rgba(255,255,255,0.07);
  --surf3: rgba(255,255,255,0.10);
  --border: rgba(255,255,255,0.08);
  --border2: rgba(255,255,255,0.14);
  --text: #e8f0ea;
  --muted: rgba(200,220,205,0.45);
  --muted2: rgba(200,220,205,0.68);
  --accent: #c8f060;
  --accent2: #60d4c8;
  --accent3: #f0c060;
  --accent4: #60d4a0;
  --danger: #f07070;
  --success: #60d4a0;
  --warn: #f0c060;
  --glow: rgba(200,240,96,0.12);
  --r: 16px;
  --r-sm: 10px;
  --r-xs: 6px;
  --nav-h: 68px;
  --tap: 44px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{
  font-family:'Outfit',sans-serif;
  background:var(--bg); color:var(--text);
  font-size:15px; line-height:1.5;
  padding-bottom:var(--nav-h);
}
h1,h2,h3,h4,.serif{font-family:'Playfair Display',serif}

/* ── GLOBAL BG ── */
body::before {
  content:'';
  position:fixed; inset:0; z-index:-2;
  background:
    radial-gradient(ellipse 80% 60% at 10% 0%, rgba(30,80,40,0.55) 0%, transparent 60%),
    radial-gradient(ellipse 60% 50% at 90% 100%, rgba(20,80,60,0.35) 0%, transparent 55%),
    radial-gradient(ellipse 50% 40% at 50% 50%, rgba(200,240,96,0.04) 0%, transparent 70%),
    #0b0f0c;
}
body::after {
  content:'';
  position:fixed; inset:0; z-index:-1;
  background-image:
    radial-gradient(circle, rgba(200,240,96,0.06) 1px, transparent 1px),
    radial-gradient(circle, rgba(96,212,160,0.04) 1px, transparent 1px);
  background-size: 40px 40px, 80px 80px;
  background-position: 0 0, 20px 20px;
  mask-image: linear-gradient(to bottom, transparent 0%, black 20%, black 80%, transparent 100%);
}

/* ── FLOATING ORBS ── */
.orb {
  position:fixed; border-radius:50%; z-index:-1;
  filter:blur(60px); pointer-events:none; opacity:0.6;
  animation: float 8s ease-in-out infinite;
}
.orb1{width:300px;height:300px;background:radial-gradient(circle,rgba(80,160,80,0.3),transparent);top:-80px;left:-80px;animation-delay:0s}
.orb2{width:250px;height:250px;background:radial-gradient(circle,rgba(96,212,160,0.2),transparent);bottom:100px;right:-60px;animation-delay:-3s}
.orb3{width:180px;height:180px;background:radial-gradient(circle,rgba(200,240,96,0.12),transparent);top:40%;left:60%;animation-delay:-6s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(20px,-15px) scale(1.05)}66%{transform:translate(-10px,10px) scale(.97)}}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--accent);border-radius:4px;opacity:.4}

/* ── GLASSMORPHISM BASE ── */
.glass {
  background: rgba(255,255,255,0.04);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.09);
}
.glass-strong {
  background: rgba(255,255,255,0.07);
  backdrop-filter: blur(30px);
  -webkit-backdrop-filter: blur(30px);
  border: 1px solid rgba(255,255,255,0.13);
}

/* ── NAV BAR ── */
.bottom-nav{
  position:fixed; bottom:0; left:0; right:0; height:var(--nav-h);
  background: rgba(6,6,18,0.85);
  backdrop-filter: blur(30px);
  -webkit-backdrop-filter: blur(30px);
  border-top:1px solid rgba(255,255,255,0.08);
  display:flex; z-index:200;
  padding: 0 8px;
}
.nav-item{
  flex:1; display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:4px; cursor:pointer;
  color:var(--muted); font-size:10px; font-weight:500; letter-spacing:.03em;
  border:none; background:transparent; padding:8px 0;
  transition:all .2s; position:relative; min-height:var(--nav-h);
}
.nav-item svg{width:20px;height:20px;stroke-width:1.8;fill:none;stroke:currentColor;transition:all .2s}
.nav-item.active{color:var(--accent)}
.nav-item.active svg{stroke:var(--accent);filter:drop-shadow(0 0 6px rgba(200,240,96,.5))}
.nav-item.active::after{
  content:''; position:absolute; bottom:0; left:50%; transform:translateX(-50%);
  width:24px; height:2px; background:var(--accent); border-radius:2px;
  box-shadow:0 0 8px rgba(200,240,96,.6);
}
.nav-item:active{transform:scale(.92)}

/* ── PAGE ── */
.page{display:none;min-height:calc(100vh - var(--nav-h));padding:20px 16px 28px}
.page.active{display:block}

/* ── TOP BAR ── */
.top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;padding-top:4px}
.logo{
  font-family:'Playfair Display',serif;font-size:22px;font-weight:900;
  letter-spacing:-.5px;
  background:linear-gradient(135deg,#c8f060,#60d4a0,#60d4c8);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  background-clip:text;
  filter:drop-shadow(0 0 20px rgba(200,240,96,.3));
}

/* ── MONTH PILLS ── */
.month-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:20px;scrollbar-width:none}
.month-row::-webkit-scrollbar{display:none}
.month-pill{
  flex-shrink:0; font-size:12px; padding:7px 16px; border-radius:40px;
  border:1px solid var(--border2); background:rgba(255,255,255,0.05);
  color:var(--muted2); cursor:pointer; font-family:'Outfit',sans-serif;
  transition:all .2s; white-space:nowrap; min-height:var(--tap);
  display:flex; align-items:center; backdrop-filter:blur(10px);
}
.month-pill:hover{border-color:var(--accent);color:var(--text)}
.month-pill.active{
  background:linear-gradient(135deg,rgba(200,240,96,.18),rgba(96,212,160,.1));
  color:var(--text); border-color:var(--accent);
  box-shadow:0 0 16px rgba(200,240,96,.15), inset 0 0 12px rgba(200,240,96,.04);
}
.month-pill.add{border-style:dashed;color:var(--muted)}
.month-pill.add:hover{border-color:var(--accent);color:var(--accent)}

/* ── METRIC CARDS ── */
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.metric-card{
  border-radius:var(--r); padding:18px 16px;
  background:rgba(255,255,255,0.04);
  backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.09);
  transition:transform .2s, box-shadow .2s;
  position:relative; overflow:hidden;
}
.metric-card::before{
  content:''; position:absolute; top:0; left:0; right:0; height:1px;
  background:linear-gradient(90deg,transparent,rgba(200,240,96,.35),transparent);
}
.metric-card:active{transform:scale(.97)}
.metric-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.09em;margin-bottom:8px;font-weight:500}
.metric-value{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;line-height:1.2}
.metric-sub{font-size:11px;color:var(--muted);margin-top:5px}
.metric-card .metric-glow{
  position:absolute; bottom:-20px; right:-20px;
  width:80px; height:80px; border-radius:50%;
  filter:blur(25px); opacity:0.4;
}

/* ── PANELS ── */
.panel{
  border-radius:var(--r); padding:18px; margin-bottom:14px;
  background:rgba(255,255,255,0.04);
  backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.09);
  position:relative; overflow:hidden;
}
.panel::before{
  content:''; position:absolute; top:0; left:0; right:0; height:1px;
  background:linear-gradient(90deg,transparent,rgba(200,240,96,.25),rgba(96,212,160,.15),transparent);
}
.panel-title{
  font-size:10px;font-weight:600;color:var(--muted);
  text-transform:uppercase;letter-spacing:.1em;margin-bottom:16px;
}

/* ── CAT BARS ── */
.cat-row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.cat-row:last-child{margin-bottom:0}
.cat-swatch{width:8px;height:8px;border-radius:2px;flex-shrink:0;box-shadow:0 0 6px currentColor}
.cat-name{font-size:13px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted2)}
.cat-track{flex:1.2;background:rgba(255,255,255,0.06);border-radius:3px;height:4px;overflow:hidden}
.cat-fill{height:100%;border-radius:3px;transition:width .6s cubic-bezier(.4,0,.2,1)}
.cat-amt{font-size:11px;color:var(--muted);min-width:72px;text-align:right}

/* ── DONUT ── */
#donut-wrap{position:relative;height:175px}

/* ── UPLOAD ZONE ── */
.upload-outer{
  border-radius:var(--r); overflow:hidden;
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(255,255,255,0.09);
  backdrop-filter:blur(20px);
  margin-bottom:14px;
}
.import-type-row{display:grid;grid-template-columns:1fr 1fr;gap:0;border-bottom:1px solid rgba(255,255,255,0.07)}
.import-type-btn{
  padding:16px 12px; cursor:pointer; text-align:center;
  color:var(--muted); transition:all .2s; font-family:'Outfit',sans-serif;
  background:transparent; border:none;
  border-right:1px solid rgba(255,255,255,0.07);
}
.import-type-btn:last-child{border-right:none}
.import-type-btn:hover{background:rgba(255,255,255,0.04);color:var(--text)}
.import-type-btn.active{
  background:linear-gradient(180deg,rgba(200,240,96,.1),rgba(200,240,96,.03));
  color:var(--text);
}
.import-type-btn.active .itype-icon{filter:drop-shadow(0 0 8px rgba(200,240,96,.4))}
.itype-icon{font-size:22px;display:block;margin-bottom:4px;transition:filter .2s}
.itype-label{font-size:13px;font-weight:500}
.itype-sub{font-size:10px;color:var(--muted)}

.upload-zone{
  padding:36px 24px; text-align:center; cursor:pointer;
  transition:all .25s; position:relative;
}
.upload-zone:hover,.upload-zone.drag{background:rgba(200,240,96,0.04)}
.upload-zone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.upload-icon{
  width:56px;height:56px;border-radius:18px;margin:0 auto 14px;
  display:flex;align-items:center;justify-content:center;font-size:24px;
  background:linear-gradient(135deg,rgba(200,240,96,.15),rgba(96,212,160,.1));
  border:1px solid rgba(200,240,96,.22);
  box-shadow:0 0 20px rgba(200,240,96,.12);
  transition:all .3s;
}
.upload-zone:hover .upload-icon{box-shadow:0 0 30px rgba(200,240,96,.25);transform:scale(1.05)}
.upload-title{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;margin-bottom:8px}
.upload-sub{color:var(--muted2);font-size:13px;line-height:1.75}
.upload-sub strong{color:var(--accent)}
.privacy-badge{
  display:inline-flex;align-items:center;gap:7px;
  background:rgba(52,211,153,.08);color:var(--success);
  border:1px solid rgba(52,211,153,.2);
  border-radius:40px;padding:5px 13px;font-size:11px;margin-top:16px;
}
.privacy-dot{width:6px;height:6px;border-radius:50%;background:var(--success);box-shadow:0 0 6px var(--success)}

/* ── ANALYZING ── */
.analyzing{
  text-align:center;padding:52px 24px;
  background:rgba(255,255,255,0.03);
  backdrop-filter:blur(20px);
  border-radius:var(--r);
  border:1px solid rgba(255,255,255,0.08);
}
.spinner{
  width:40px;height:40px;border-radius:50%;
  border:2px solid rgba(200,240,96,.15);
  border-top-color:var(--accent);
  animation:spin .75s linear infinite;margin:0 auto 20px;
  box-shadow:0 0 20px rgba(200,240,96,.15);
}
@keyframes spin{to{transform:rotate(360deg)}}
.step-list{display:flex;flex-direction:column;gap:10px;max-width:260px;margin:20px auto 0;text-align:left}
.step-item{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.step-dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.1);flex-shrink:0;transition:all .3s}
.step-dot.done{background:var(--success);box-shadow:0 0 6px var(--success)}
.step-dot.active{background:var(--accent);box-shadow:0 0 10px var(--accent);animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

/* ── TRANSACTIONS ── */
.tx-filters{display:flex;gap:7px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px;scrollbar-width:none}
.tx-filters::-webkit-scrollbar{display:none}
.tx-filter{
  flex-shrink:0;font-size:11px;padding:5px 13px;border-radius:40px;
  border:1px solid var(--border); background:transparent; color:var(--muted);
  cursor:pointer;transition:all .15s;white-space:nowrap;
  min-height:34px;display:flex;align-items:center;
}
.tx-filter:hover{border-color:var(--accent);color:var(--text)}
.tx-filter.active{
  background:rgba(200,240,96,.12);color:var(--text);
  border-color:rgba(200,240,96,.35);
  box-shadow:0 0 10px rgba(200,240,96,.08);
}
.tx-list{display:flex;flex-direction:column;gap:8px}
.tx-row{
  display:flex;align-items:center;gap:12px;
  padding:13px 14px;border-radius:var(--r-sm);
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.07);
  transition:all .2s; backdrop-filter:blur(10px);
}
.tx-row:hover{background:rgba(255,255,255,0.07);border-color:rgba(255,255,255,0.12);transform:translateX(2px)}
.tx-row.flagged{border-color:rgba(251,191,36,.2);background:rgba(251,191,36,.04)}
.tx-dot{width:9px;height:9px;border-radius:3px;flex-shrink:0}
.tx-info{flex:1;min-width:0}
.tx-desc{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.tx-meta{font-size:11px;color:var(--muted);margin-top:2px}
.tx-amount{font-family:'Playfair Display',serif;font-size:14px;font-weight:700;white-space:nowrap}
.tx-actions{display:flex;gap:5px}
.tx-btn{
  background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);
  color:var(--muted);border-radius:var(--r-xs);
  padding:5px 9px;font-size:11px;cursor:pointer;
  min-width:var(--tap);min-height:var(--tap);
  display:flex;align-items:center;justify-content:center;
  transition:all .15s; backdrop-filter:blur(5px);
}
.tx-btn:hover{background:rgba(255,255,255,0.1);color:var(--text);border-color:rgba(255,255,255,0.18)}
.tx-btn.danger:hover{background:rgba(248,113,113,.1);border-color:rgba(248,113,113,.3);color:var(--danger)}
.flag-badge{
  font-size:10px;padding:2px 7px;border-radius:40px;
  background:rgba(251,191,36,.12);color:var(--warn);
  border:1px solid rgba(251,191,36,.25);white-space:nowrap;
}

/* ── FORM ELEMENTS ── */
.add-form{display:flex;flex-direction:column;gap:12px;margin-bottom:16px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-field{display:flex;flex-direction:column;gap:6px}
.form-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.form-input,.form-select{
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:var(--r-sm);color:var(--text);
  padding:11px 13px;font-size:14px;font-family:'Outfit',sans-serif;
  width:100%;min-height:var(--tap);
  transition:all .2s; backdrop-filter:blur(10px);
}
.form-input::placeholder{color:var(--muted)}
.form-input:focus,.form-select:focus{
  outline:none;
  border-color:rgba(200,240,96,.45);
  background:rgba(200,240,96,.05);
  box-shadow:0 0 0 3px rgba(200,240,96,.08);
}
.form-select option{background:#0f0f1e;color:var(--text)}
.btn{
  border:none;border-radius:var(--r-sm);padding:13px 20px;font-size:14px;
  font-weight:600;cursor:pointer;font-family:'Outfit',sans-serif;
  min-height:var(--tap);transition:all .2s;
  display:flex;align-items:center;justify-content:center;gap:8px;
  letter-spacing:.02em;
}
.btn:active{transform:scale(.96)}
.btn-primary{
  background:linear-gradient(135deg,#2d7a3a,#1a5c45);
  color:#c8f060;
  box-shadow:0 4px 20px rgba(45,122,58,.35);
}
.btn-primary:hover{box-shadow:0 6px 28px rgba(45,122,58,.5);transform:translateY(-1px)}
.btn-ghost{
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.12);
  color:var(--muted2); backdrop-filter:blur(10px);
}
.btn-ghost:hover{background:rgba(255,255,255,0.1);color:var(--text)}

/* ── BUDGET CARDS ── */
.budget-card{
  border-radius:var(--r); padding:18px; margin-bottom:12px;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.08);
  backdrop-filter:blur(20px); position:relative; overflow:hidden;
  transition:border-color .2s;
}
.budget-card::before{
  content:''; position:absolute; top:0; left:0; right:0; height:1px;
  background:linear-gradient(90deg,transparent,var(--stripe-color, rgba(167,139,250,.3)),transparent);
}
.budget-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.budget-name{font-weight:600;font-size:14px;letter-spacing:-.01em}
.status-pill{font-size:10px;padding:3px 10px;border-radius:40px;font-weight:600;letter-spacing:.03em}
.status-ok{background:rgba(52,211,153,.12);color:var(--success);border:1px solid rgba(52,211,153,.25)}
.status-warn{background:rgba(251,191,36,.12);color:var(--warn);border:1px solid rgba(251,191,36,.25)}
.status-over{background:rgba(248,113,113,.12);color:var(--danger);border:1px solid rgba(248,113,113,.25)}
.budget-track{background:rgba(255,255,255,.06);border-radius:4px;height:6px;margin-bottom:10px;overflow:hidden}
.budget-fill{height:100%;border-radius:4px;transition:width .7s cubic-bezier(.4,0,.2,1)}
.budget-footer{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}

/* ── INCOME CARD ── */
.income-card{
  border-radius:var(--r); padding:18px; margin-bottom:18px;
  background:linear-gradient(135deg,rgba(200,240,96,.07),rgba(96,212,160,.05));
  border:1px solid rgba(200,240,96,.18);
  backdrop-filter:blur(20px);
  box-shadow:0 0 30px rgba(200,240,96,.06);
}

/* ── INSIGHTS ── */
.insight-card{
  border-radius:var(--r); padding:18px 18px; margin-bottom:12px;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.08);
  backdrop-filter:blur(20px);
  display:flex;gap:14px;align-items:flex-start;
  transition:transform .2s, border-color .2s;
  border-left:3px solid var(--ins-color, rgba(167,139,250,.5));
}
.insight-card:hover{transform:translateX(3px)}
.insight-icon{
  width:40px;height:40px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;font-size:18px;
  flex-shrink:0; background:var(--ins-bg, rgba(167,139,250,.1));
}
.insight-title{font-weight:600;font-size:14px;margin-bottom:4px;line-height:1.3}
.insight-body{font-size:13px;color:var(--muted2);line-height:1.65}
.insight-hi{color:var(--text);font-weight:600}

/* ── MODAL ── */
.modal-backdrop{
  position:fixed;inset:0;z-index:300;
  background:rgba(0,0,0,.6);
  backdrop-filter:blur(8px);
  display:flex;align-items:flex-end;
  opacity:0;pointer-events:none;transition:opacity .25s;
}
.modal-backdrop.open{opacity:1;pointer-events:all}
.modal-sheet{
  width:100%;border-radius:var(--r) var(--r) 0 0;
  background:rgba(15,12,30,0.95);
  backdrop-filter:blur(40px);
  border:1px solid rgba(255,255,255,0.1);
  border-bottom:none;
  padding:24px 20px 36px;
  transform:translateY(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);
  box-shadow:0 -20px 60px rgba(0,0,0,.5);
}
.modal-backdrop.open .modal-sheet{transform:translateY(0)}

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>

// ── CONSTANTS ──
const CATS = ['Groceries','Cafeteria/Tea','Dining','Home & Shopping','Jewellery','Transport/Fines','Telecom','Other'];
const CAT_COLORS = {
  'Groceries':      '#60d4a0',
  'Cafeteria/Tea':  '#f0c060',
  'Dining':         '#f07090',
  'Home & Shopping':'#a070f0',
  'Jewellery':      '#70b0f0',
  'Transport/Fines':'#f08060',
  'Telecom':        '#60c4f0',
  'Other':          '#6e6d6a'
};
const STORAGE_KEY = 'spendlens_v1';

// ── SAFE TEXT ──
function esc(str) {
  const d = document.createElement('div');
  d.textContent = String(str ?? '');
  return d.innerHTML;
}

// ── STORAGE (resilient) ──
let storageOk = true;
function loadDb() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e) { storageOk = false; }
  return { income: 0, budgets: defaultBudgets(), months: {} };
}
function saveDb() {
  if (!storageOk) return;
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); }
  catch(e) {
    storageOk = false;
    showToast('Storage full -- changes may not be saved', 'warn');
  }
}
function defaultBudgets() {
  return {Groceries:300,'Cafeteria/Tea':150,Dining:120,'Home & Shopping':250,Jewellery:700,'Transport/Fines':600,Telecom:100,Other:150};
}

// ── STATE ──
let db = loadDb();
let activeMonth = Object.keys(db.months)[0] ?? null;
let activeTab = 'overview';
let donutChart = null;
let editingTxn = null;
let logFilter = 'All';
let nextId = Date.now();

// ── HELPERS ──
function catTotals(txns) {
  const t = Object.fromEntries(CATS.map(c=>[c,0]));
  (txns||[]).forEach(tx => { if(t[tx.cat]!==undefined) t[tx.cat] += tx.amt; else t['Other'] += tx.amt; });
  return t;
}
function totalSpend(txns) { return (txns||[]).reduce((s,t)=>s+t.amt,0); }
function fmtAmt(n) { return 'AED ' + (Math.round(n*100)/100).toFixed(2); }
function fmtAmtShort(n) { return (Math.round(n*10)/10).toFixed(1); }
function curTxns() { return db.months[activeMonth]?.txns ?? []; }

// ── TOAST ──
function showToast(msg, type='info') {
  let t = document.getElementById('toast');
  if (!t) { t = document.createElement('div'); t.id='toast'; document.body.appendChild(t); }
  Object.assign(t.style, {
    position:'fixed', bottom:'calc(var(--nav-h) + 12px)', left:'50%', transform:'translateX(-50%)',
    padding:'10px 18px', borderRadius:'40px', fontSize:'13px', zIndex:'500',
    background: type==='warn'?'#856020':type==='error'?'#802020':'#205040',
    color:'#fff', whiteSpace:'nowrap', transition:'opacity .2s',
    boxShadow:'0 4px 20px rgba(0,0,0,.4)'
  });
  t.textContent = msg; t.style.opacity='1';
  clearTimeout(t._to); t._to = setTimeout(()=>t.style.opacity='0', 2800);
}

// ── TAB ROUTING ──
function showTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach((b,i) => {
    b.classList.toggle('active', ['overview','log','budgets','insights'][i]===tab);
  });
  document.getElementById('page-'+tab).classList.add('active');
  if (tab==='overview') renderOverview();
  if (tab==='log')      renderLog();
  if (tab==='budgets')  renderBudgets();
  if (tab==='insights') renderInsights();
}

// ── MONTH BAR ──
function renderMonthBar() {
  const months = Object.keys(db.months);
  document.getElementById('month-bar').innerHTML = months.length ? `
    <div class="month-row" role="list" aria-label="Statement months">
      ${months.map(m=>`
        <button class="month-pill${m===activeMonth?' active':''}" onclick="switchMonth('${esc(m)}')" role="listitem">${esc(m)}</button>
      `).join('')}
      <button class="month-pill add" onclick="triggerNewUpload()">+ New</button>
    </div>` : '';
}

function switchMonth(m) {
  activeMonth = m; logFilter = 'All';
  if (activeTab==='overview') renderOverview();
  else if (activeTab==='log') renderLog();
  else if (activeTab==='insights') renderInsights();
  else if (activeTab==='budgets') renderBudgets();
}

// ── OVERVIEW ──
function renderOverview() {
  renderMonthBar();
  const el = document.getElementById('overview-content');
  checkApiKeyOnLoad();
if (!activeMonth) { el.innerHTML = uploadZoneHTML(); initDrop('overview-content'); return; }
  const txns = curTxns();
  const totals = catTotals(txns);
  const spend = totalSpend(txns);
  const sorted = Object.entries(totals).filter(e=>e[1]>0).sort((a,b)=>b[1]-a[1]);
  const flagged = txns.filter(t=>t.flagged).length;
  const remaining = db.income > 0 ? db.income - spend : null;

  el.innerHTML = `
    ${flagged > 0 ? `<div class="banner banner-warn fade-up">
      ⚠️ ${flagged} transaction${flagged>1?'s were':' was'} flagged as uncertain by AI -- please review in the Log tab.
    </div>` : ''}
    <div class="metrics fade-up">
      <div class="metric-card">
        <div class="metric-label">Total spent</div>
        <div class="metric-value text-accent">${fmtAmt(spend)}</div>
        <div class="metric-sub">${txns.length} transactions</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Biggest category</div>
        <div class="metric-value">${sorted[0] ? esc(sorted[0][0].split('/')[0]) : '--'}</div>
        <div class="metric-sub">${sorted[0] ? fmtAmt(sorted[0][1]) : ''}</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">${remaining!==null ? 'Remaining' : 'Daily avg'}</div>
        <div class="metric-value ${remaining!==null ? (remaining>=0?'text-success':'text-danger') : ''}">
          ${remaining!==null ? (remaining>=0?'+':'')+fmtAmtShort(remaining) : fmtAmtShort(spend/30)}
        </div>
        <div class="metric-sub">${remaining!==null ? (remaining>=0?'left to save':'over budget') : 'AED/day est.'}</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Transactions</div>
        <div class="metric-value">${txns.length}</div>
        <div class="metric-sub">${esc(activeMonth)}</div>
      </div>
    </div>
    <div class="panel fade-up" style="animation-delay:.08s">
      <div class="panel-title">By category</div>
      ${sorted.map(([cat,amt])=>`
        <div class="cat-row">
          <div class="cat-swatch" style="background:${CAT_COLORS[cat]}"></div>
          <div class="cat-name">${esc(cat)}</div>
          <div class="cat-track"><div class="cat-fill" style="width:${spend>0?(amt/spend*100).toFixed(1):0}%;background:${CAT_COLORS[cat]}"></div></div>
          <div class="cat-amt">${fmtAmt(amt)}</div>
        </div>`).join('')}
    </div>
    <div class="panel fade-up" style="animation-delay:.14s">
      <div class="panel-title">Distribution</div>
      <div id="donut-wrap"><canvas id="donut-main" role="img" aria-label="Spending distribution by category: ${sorted.map(([c,a])=>c+' '+fmtAmt(a)).join(', ')}"></canvas></div>
    </div>`;

  if (donutChart) { donutChart.destroy(); donutChart = null; }
  setTimeout(()=>{
    const ctx = document.getElementById('donut-main');
    if (!ctx) return;
    donutChart = new Chart(ctx, {
      type:'doughnut',
      data:{labels:sorted.map(s=>s[0]),datasets:[{data:sorted.map(s=>+(s[1].toFixed(2))),backgroundColor:sorted.map(s=>CAT_COLORS[s[0]]),borderWidth:2,borderColor:'#141418'}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>`${c.label}: ${fmtAmt(c.raw)}`}}}}
    });
  }, 100);
}

// ── UPLOAD ──
function uploadZoneHTML() {
  return `
    <div style="margin-bottom:12px">
      <div class="section-label" style="margin-bottom:10px">Choose import type</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px">
        <button class="import-type-btn active" id="btn-img" onclick="setImportType('image')">
          <div style="font-size:22px;margin-bottom:4px">📷</div>
          <div style="font-size:13px;font-weight:500">Screenshot</div>
          <div style="font-size:11px;color:var(--muted)">JPG, PNG</div>
        </button>
        <button class="import-type-btn" id="btn-xl" onclick="setImportType('excel')">
          <div style="font-size:22px;margin-bottom:4px">📊</div>
          <div style="font-size:13px;font-weight:500">Excel / CSV</div>
          <div style="font-size:11px;color:var(--muted)">.xlsx, .csv</div>
        </button>
      </div>
    </div>
    <div class="upload-zone" id="drop-zone" role="button" tabindex="0"
         onclick="document.getElementById('file-inp').click()"
         onkeydown="if(event.key==='Enter'||event.key===' ')document.getElementById('file-inp').click()">
      <input type="file" id="file-inp" accept="image/*,.xlsx,.xls,.csv" style="display:none" onchange="handleFile(this.files[0])">
      <div class="upload-icon" id="upload-icon-emoji">📷</div>
      <div class="upload-title" id="upload-title-text">Upload statement screenshot</div>
      <div class="upload-sub" id="upload-sub-text">
        Crop out your <strong style="color:var(--accent)">name, card number &amp; account details</strong><br>
        Just the merchant list, amounts and dates
      </div>
      <div class="privacy-badge"><div class="privacy-dot"></div>File not stored after extraction</div>
    </div>`;
}

let importType = 'image';
function setImportType(type) {
  importType = type;
  const btnImg = document.getElementById('btn-img');
  const btnXl = document.getElementById('btn-xl');
  if (btnImg) btnImg.classList.toggle('active', type==='image');
  if (btnXl) btnXl.classList.toggle('active', type==='excel');
  const inp = document.getElementById('file-inp');
  const icon = document.getElementById('upload-icon-emoji');
  const title = document.getElementById('upload-title-text');
  const sub = document.getElementById('upload-sub-text');
  if (!inp) return;
  if (type==='image') {
    inp.accept = 'image/*';
    if(icon) icon.textContent = '📷';
    if(title) title.textContent = 'Upload statement screenshot';
    if(sub) sub.innerHTML = 'Crop out your <strong style="color:var(--accent)">name, card number &amp; account details</strong><br>Just the merchant list, amounts and dates';
  } else {
    inp.accept = '.xlsx,.xls,.csv';
    if(icon) icon.textContent = '📊';
    if(title) title.textContent = 'Upload Excel or CSV file';
    if(sub) sub.innerHTML = 'Export your statement from your banking app as <strong style="color:var(--accent)">.xlsx or .csv</strong><br>Claude will read the columns automatically';
  }
}

function triggerNewUpload() {
  importType = 'image';
  activeMonth = null;
  renderMonthBar();
  document.getElementById('overview-content').innerHTML = uploadZoneHTML();
  initDrop('overview-content');
  showTab('overview');
}

function initDrop(containerId) {
  const zone = document.getElementById('drop-zone');
  if (!zone) return;
  zone.addEventListener('dragover', e=>{ e.preventDefault(); zone.classList.add('drag'); });
  zone.addEventListener('dragleave', ()=>zone.classList.remove('drag'));
  zone.addEventListener('drop', e=>{ e.preventDefault(); zone.classList.remove('drag'); if(e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); });
}

async function handleFile(file) {
  if (!file) return;
  const isImage = file.type.startsWith('image/');
  const isExcel = file.name.endsWith('.xlsx') || file.name.endsWith('.xls');
  const isCSV = file.name.endsWith('.csv') || file.type === 'text/csv';

  if (!isImage && !isExcel && !isCSV) {
    document.getElementById('overview-content').innerHTML =
      `<div class="banner banner-error">Please upload an image (JPG/PNG) or spreadsheet (.xlsx/.csv)</div>` + uploadZoneHTML();
    initDrop('overview-content'); return;
  }
  if (file.size > 15 * 1024 * 1024) {
    document.getElementById('overview-content').innerHTML =
      `<div class="banner banner-error">File is too large (max 15 MB).</div>` + uploadZoneHTML();
    initDrop('overview-content'); return;
  }

  if (isCSV) {
    handleCSV(file); return;
  }
  if (isExcel) {
    handleExcel(file); return;
  }

  // Image path
  const reader = new FileReader();
  reader.onload = async (e) => {
    const b64 = e.target.result.split(',')[1];
    document.getElementById('overview-content').innerHTML = analyzingHTML();
    await analyzeStatement(b64, file.type);
  };
  reader.readAsDataURL(file);
}

// ── CSV HANDLER ──
function handleCSV(file) {
  document.getElementById('overview-content').innerHTML = analyzingHTML('Reading CSV file...');
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const text = e.target.result;
      const rows = text.split('\n').map(r => r.split(',').map(c => c.replace(/^"|"$/g, '').trim()));
      const headers = rows[0].map(h => h.toLowerCase());
      const txns = parseRowsToTxns(headers, rows.slice(1));
      if (txns.length === 0) throw new Error('No transactions found. Make sure the CSV has columns for date, description/merchant, and amount.');
      saveImportedTxns(txns, file.name.replace(/\.csv$/i,''));
    } catch(err) {
      showImportError(err.message);
    }
  };
  reader.readAsText(file);
}

// ── EXCEL HANDLER ──
function handleExcel(file) {
  document.getElementById('overview-content').innerHTML = analyzingHTML('Reading Excel file...');
  if (typeof XLSX === 'undefined') {
    const script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    script.onload = () => doParseExcel(file);
    script.onerror = () => showImportError('Could not load Excel parser. Check your internet connection.');
    document.head.appendChild(script);
  } else {
    doParseExcel(file);
  }
}

function doParseExcel(file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, { type: 'array', cellDates: true });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
      if (rows.length < 2) throw new Error('Sheet appears empty.');
      const headers = rows[0].map(h => String(h).toLowerCase().trim());
      const txns = parseRowsToTxns(headers, rows.slice(1));
      if (txns.length === 0) throw new Error('No transactions found. Make sure columns include date, description/merchant, and amount.');
      saveImportedTxns(txns, file.name.replace(/\.xlsx?$/i,''));
    } catch(err) {
      showImportError(err.message);
    }
  };
  reader.readAsArrayBuffer(file);
}

// ── PARSE ROWS (CSV + Excel shared) ──
function parseRowsToTxns(headers, rows) {
  // Find column indexes by common header names
  const find = (...names) => {
    for (const n of names) {
      const idx = headers.findIndex(h => h.includes(n));
      if (idx >= 0) return idx;
    }
    return -1;
  };
  const dateCol = find('date', 'txn date', 'transaction date', 'value date', 'posted');
  const descCol = find('description', 'merchant', 'details', 'narration', 'particulars', 'remarks');
  const amtCol  = find('amount', 'debit', 'withdrawal', 'spent', 'charge');
  const catCol  = find('category', 'cat', 'type');

  if (descCol < 0 || amtCol < 0) {
    throw new Error('Could not find merchant/description or amount columns. Headers found: ' + headers.join(', '));
  }

  const txns = [];
  let id = Date.now();
  for (const row of rows) {
    if (!row || row.length === 0) continue;
    const rawAmt = String(row[amtCol] || '').replace(/[^0-9.\-]/g, '');
    const amt = parseFloat(rawAmt);
    if (!amt || amt <= 0) continue; // skip credits, blanks

    const desc = String(row[descCol] || '').trim().slice(0, 80);
    if (!desc) continue;

    let date = '';
    if (dateCol >= 0 && row[dateCol]) {
      const d = row[dateCol];
      if (d instanceof Date) {
        date = d.toISOString().slice(0,10);
      } else {
        const parsed = new Date(String(d));
        date = isNaN(parsed) ? '' : parsed.toISOString().slice(0,10);
      }
    }

    const rawCat = catCol >= 0 ? String(row[catCol]||'').trim() : '';
    const cat = CATS.includes(rawCat) ? rawCat : guessCat(desc);

    txns.push({ id: id++, date, desc, cat, amt: Math.round(amt*100)/100, flagged: false });
  }
  return txns;
}

// ── GUESS CATEGORY FROM MERCHANT NAME ──
function guessCat(desc) {
  const d = desc.toLowerCase();
  if (/lulu|carrefour|spinneys|choithrams|grocery|minimart|hypermarket|supermarket|waitrose/.test(d)) return 'Groceries';
  if (/cafe|cafeteria|coffee|tea|bakery|karak|chai/.test(d)) return 'Cafeteria/Tea';
  if (/restaurant|pizza|burger|kfc|mcdonalds|subway|sushi|grill|diner|eatery|bistro|food|dining/.test(d)) return 'Dining';
  if (/gold|jewel|diamond|jewellery|jewelry/.test(d)) return 'Jewellery';
  if (/rta|salik|nol|taxi|uber|careem|fuel|petrol|parking|fine|traffic/.test(d)) return 'Transport/Fines';
  if (/du |etisalat|telecom|mobile|internet|phone|data plan/.test(d)) return 'Telecom';
  if (/ikea|home|furniture|decor|mall|fashion|clothing|apparel|shop|store|gift/.test(d)) return 'Home & Shopping';
  return 'Other';
}

async function analyzeStatement(b64, mime) {
  try {
    setStep(2);
    const prompt = `You are a financial data extraction assistant. Carefully analyze this credit card or bank statement screenshot and extract ALL visible transactions.

For each transaction, return:
- date: YYYY-MM-DD format. If year is missing, use 2026. If date is fully unclear, use "".
- desc: merchant or payee name exactly as shown. Do NOT invent names.
- amt: transaction amount as a positive number. Do NOT invent amounts.
- cat: one of exactly: Groceries, Cafeteria/Tea, Dining, Home & Shopping, Jewellery, Transport/Fines, Telecom, Other
- flagged: true if you are uncertain about the merchant name, amount, or date. Otherwise false.

Categorization guide for UAE:
- LuLu, Carrefour, Spinneys, Choithrams, small grocery/minimart → Groceries
- Cafes, cafeterias, tea shops, small corner shops, local bakeries → Cafeteria/Tea
- Restaurants, fast food chains, food delivery → Dining
- Gold shops, jewellery stores → Jewellery
- RTA, Salik, NOL, taxi, fuel, traffic fines, parking → Transport/Fines
- DU, Etisalat/e&, phone bills, internet → Telecom
- Furniture, homeware, clothing, department stores → Home & Shopping
- Anything unclear or not fitting above → Other

Also extract:
- month: the statement period as shown (e.g. "March 2026" or "Mar–Apr 2026"). If not shown, return "".
- currency: currency shown (default "AED").

IMPORTANT RULES:
- If you cannot confidently read a merchant name or amount, set flagged:true and do your best.
- If a row is clearly not a transaction (e.g. a header, total row, opening balance), skip it.
- Do NOT include credit reversals or payments as transactions unless they are clearly purchases.
- Return ONLY valid JSON, no markdown, no explanation.

JSON format:
{
  "month": "",
  "currency": "AED",
  "transactions": [
    {"date":"2026-03-24","desc":"Merchant Name","amt":25.50,"cat":"Groceries","flagged":false}
  ]
}`;

    setStep(2);
    const apiKey = getApiKey();
    if (!apiKey) {
      document.getElementById('api-key-banner').style.display = 'block';
      throw new Error('API key not set. Please enter your Google Gemini API key in the bar above.');
    }

    const geminiUrl = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=' + apiKey;

    const res = await fetch(geminiUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{
          parts: [
            { inline_data: { mime_type: mime, data: b64 } },
            { text: prompt }
          ]
        }],
        generationConfig: { temperature: 0.1, maxOutputTokens: 2048 }
      })
    });

    setStep(3);

    if (!res.ok) {
      const errData = await res.json().catch(()=>({}));
      const msg = errData?.error?.message || 'API error ' + res.status;
      if (res.status === 400) throw new Error('Invalid request. Please try a clearer screenshot.');
      if (res.status === 403) throw new Error('Invalid API key. Please check your Gemini key and try again.');
      if (res.status === 429) throw new Error('Rate limit reached. Wait 60 seconds and try again — free tier allows 15 uploads per minute.');
      throw new Error(msg);
    }

    const data = await res.json();
    const raw = ((data.candidates||[])[0]?.content?.parts||[]).map(p=>p.text||'').join('').replace(/```json|```/g,'').trim();

    let parsed;
    try { parsed = JSON.parse(raw); }
    catch(e) { throw new Error('Could not read response. Please try a clearer screenshot.'); }

    setStep(4);
    if (!parsed.transactions || parsed.transactions.length === 0)
      throw new Error('No transactions found in this image. Make sure the screenshot shows a list of purchases clearly.');

    const txns = parsed.transactions
      .filter(t => t.desc && t.amt > 0)
      .map((t,i) => ({
        id: Date.now() + i,
        date: String(t.date||'').slice(0,10),
        desc: String(t.desc).slice(0,80),
        cat: CATS.includes(t.cat) ? t.cat : 'Other',
        amt: Math.round(parseFloat(t.amt)*100)/100,
        flagged: !!t.flagged
      }));

    if (txns.length === 0) throw new Error('All extracted transactions were incomplete. Try a clearer screenshot.');

    const monthKey = parsed.month
      ? String(parsed.month).slice(0,30)
      : 'Import ' + new Date().toLocaleDateString('en-GB',{month:'short',year:'numeric'});

    await new Promise(r=>setTimeout(r,500));

    db.months[monthKey] = { txns, importedAt: new Date().toISOString() };
    activeMonth = monthKey;
    saveDb();
    renderOverview();
    showToast(`Imported ${txns.length} transactions`, 'info');

  } catch(err) {
    document.getElementById('overview-content').innerHTML =
      `<div class="banner banner-error"><strong>Could not analyze:</strong> ${esc(err.message)}</div>` + uploadZoneHTML();
    initDrop('overview-content');
  }
}

function setFilter(cat) { logFilter = cat; renderLog(); }

function addTxn() {
  if (!activeMonth) return;
  const desc = document.getElementById('new-desc').value.trim().slice(0,80);
  const cat  = document.getElementById('new-cat').value;
  const amt  = parseFloat(document.getElementById('new-amt').value);
  const date = document.getElementById('new-date').value;
  if (!desc) { showToast('Please enter a merchant name','warn'); return; }
  if (!amt || amt <= 0) { showToast('Please enter a valid amount','warn'); return; }
  db.months[activeMonth].txns.push({ id: ++nextId, date, desc, cat, amt: Math.round(amt*100)/100, flagged: false });
  saveDb(); renderLog();
}

function delTxn(id) {
  if (!activeMonth) return;
  db.months[activeMonth].txns = db.months[activeMonth].txns.filter(t=>t.id!==id);
  saveDb(); renderLog();
}

    <div class="add-form">

        <div class="form-field">

          <select class="form-select" id="edit-cat">${CATS.map(c=>`<option ${c===editingTxn.cat?'selected':''}>${esc(c)}</option>`).join('')}</select>
        </div>
        <div class="form-field">
          <label class="form-label">Amount (AED)</label>
          <input class="form-input" id="edit-amt" type="number" step="0.01" min="0.01" value="${editingTxn.amt}">
        </div>
      </div>
      <div class="form-field">
        <label class="form-label">Date</label>
        <input class="form-input" id="edit-date" type="date" value="${esc(editingTxn.date||'')}">

}

function saveEdit() {
  if (!editingTxn || !activeMonth) return;
  const desc = document.getElementById('edit-desc').value.trim().slice(0,80);
  const cat  = document.getElementById('edit-cat').value;
  const amt  = parseFloat(document.getElementById('edit-amt').value);
  const date = document.getElementById('edit-date').value;
  if (!desc || !amt || amt<=0) { showToast('Invalid entry','warn'); return; }
  const idx = db.months[activeMonth].txns.findIndex(t=>t.id===editingTxn.id);
  if (idx>=0) db.months[activeMonth].txns[idx] = { ...editingTxn, desc, cat, amt: Math.round(amt*100)/100, date, flagged: false };
  saveDb(); closeModal(); renderLog();
  showToast('Transaction updated');
}

function closeModal() {
  document.getElementById('edit-modal').classList.remove('open');
  editingTxn = null;
}
document.getElementById('edit-modal').addEventListener('click', e => { if(e.target===e.currentTarget) closeModal(); });

function renderBudgets() {
  const el = document.getElementById('page-budgets');
  const totals = activeMonth ? catTotals(curTxns()) : Object.fromEntries(CATS.map(c=>[c,0]));

  el.innerHTML = `
    <div class="top-bar"><div class="logo">Spend<span>Lens</span></div></div>
    ${!storageOk?'<div class="banner banner-warn">Storage unavailable -- changes won\'t persist after page close.</div>':''}
    <div class="income-card">
      <div class="section-label" style="margin-bottom:10px">Monthly income</div>
      <div style="display:flex;gap:10px;align-items:center">
        <input class="form-input" id="income-inp" type="number" min="0" step="100"
          placeholder="e.g. 8000" value="${db.income||''}" style="flex:1;font-family:'Syne',sans-serif;font-weight:700;font-size:18px">
        <button class="btn btn-primary" onclick="saveIncome()" style="white-space:nowrap">Save</button>
      </div>
      ${db.income>0&&activeMonth?`<div class="text-muted mt-sm" style="font-size:13px">
        Spent ${fmtAmt(totalSpend(curTxns()))} of ${fmtAmt(db.income)} (${Math.round(totalSpend(curTxns())/db.income*100)}%)
      </div>`:''}
    </div>
    <div class="section-label">Category budgets</div>
    ${CATS.map(cat=>{
      const spent = totals[cat]||0;
      const budget = db.budgets[cat]||0;
      const pct = budget>0 ? Math.min(100, spent/budget*100) : 0;
      const over = budget>0 && spent>budget;
      const nearOver = budget>0 && !over && pct>=80;
      const color = over?'var(--danger)':nearOver?'var(--warn)':CAT_COLORS[cat];
      const statusClass = over?'status-over':nearOver?'status-warn':'status-ok';
      const statusText = over?'Over':'Near limit'+(nearOver?'':' -- OK');
      return `<div class="budget-card">
        <div class="budget-header">
          <div class="budget-name">${esc(cat)}</div>
          ${budget>0?`<div class="status-pill ${statusClass}">${statusText}</div>`:'<div class="status-pill" style="background:var(--surf2);color:var(--muted);border:1px solid var(--border)">No limit</div>'}
        </div>
        <div class="budget-track"><div class="budget-fill" style="width:${pct.toFixed(1)}%;background:${color}"></div></div>
        <div class="budget-footer">
          <span>${fmtAmt(spent)} spent</span>
          <span>${budget>0?pct.toFixed(0)+'% of '+fmtAmt(budget):'--'}</span>
        </div>
        <div style="display:flex;gap:8px;align-items:center;margin-top:12px">
          <input class="form-input" id="b-${esc(cat.replace(/[^a-z]/gi,'_'))}" type="number" min="0" step="50"
            placeholder="Budget (AED)" value="${budget||''}" style="flex:1">
          <button class="btn btn-primary" onclick="saveBudget('${esc(cat)}','b-${esc(cat.replace(/[^a-z]/gi,'_'))}')" style="white-space:nowrap">Set</button>
        </div>
      </div>`;
    }).join('')}`;
}

}

function saveBudget(cat, inputId) {
  const v = parseFloat(document.getElementById(inputId).value);
  db.budgets[cat] = isNaN(v)||v<0 ? 0 : v;
  saveDb(); renderBudgets();
  showToast(`Budget saved for ${cat}`);

// ── INSIGHTS ──
function renderInsights() {
  const el = document.getElementById('page-insights');
  if (!activeMonth) {
    el.innerHTML=`<div class="top-bar"><div class="logo">Spend<span>Lens</span></div></div>
      <div class="empty"><div class="empty-emoji">💡</div><div class="empty-title">No data yet</div><div class="empty-sub">Upload a statement to see personalised insights.</div></div>`;
    return;
  }
  const txns = curTxns();
  const totals = catTotals(txns);
  const spend = totalSpend(txns);
  const sorted = Object.entries(totals).filter(e=>e[1]>0).sort((a,b)=>b[1]-a[1]);
  const savingsRate = db.income>0 ? (db.income-spend)/db.income*100 : null;
  const cafeAmt = totals['Cafeteria/Tea']||0;
  const cafeCount = txns.filter(t=>t.cat==='Cafeteria/Tea').length;
  const transport = totals['Transport/Fines']||0;
  const groceries = totals['Groceries']||0;
  const flagged = txns.filter(t=>t.flagged).length;

  const insights = [];

  if (flagged > 0) insights.push({
    icon:'⚠️', bg:'rgba(240,192,96,.1)', color:'var(--warn)',
    title: flagged + ' uncertain transaction' + (flagged>1?'s':''),
    body: 'The AI was not confident about ' + flagged + (flagged>1?' entries':' entry') + '. Review them in the Log tab and correct any mistakes.'
  });

  if (savingsRate !== null) {
    const good = savingsRate >= 20;
    insights.push({
      icon: good?'📈':'📉', bg: good?'rgba(96,212,160,.1)':'rgba(240,112,112,.1)', color: good?'var(--success)':'var(--danger)',
      title: good ? `Saving ${savingsRate.toFixed(0)}% this month` : `Savings rate low: ${savingsRate.toFixed(0)}%`,
      body: good
        ? `You're keeping <strong class="insight-hi">${fmtAmt(db.income-spend)}</strong> this month. Maintain this habit -- aim for 30%+ consistently.`
        : `You're spending ${Math.abs(savingsRate).toFixed(0)}% ${savingsRate<0?'more than':'of'} your income. Cut from your top 2 categories to recover.`
    });
  }

  if (cafeCount >= 5) insights.push({
    icon:'☕', bg:'rgba(240,192,96,.1)', color:'var(--warn)',
    title:`${cafeCount} cafeteria visits -- ${fmtAmt(cafeAmt)}`,
    body:`Small daily purchases add up. At this pace that's roughly <strong class="insight-hi">${fmtAmt(cafeAmt*12)}</strong> per year. A daily AED 15 limit could save you significantly.`
  });

  if (transport > 200) insights.push({
    icon:'🚗', bg:'rgba(240,112,112,.1)', color:'var(--danger)',
    title:`Transport/Fines: ${fmtAmt(transport)}`,
    body:`This is <strong class="insight-hi">${(transport/spend*100).toFixed(0)}%</strong> of your spending. If this includes a fine, check your Salik balance or RTA app to avoid future penalties.`
  });

  if (groceries > 0) {
    const trips = txns.filter(t=>t.cat==='Groceries').length;
    insights.push({
      icon:'🛒', bg:'rgba(96,212,240,.1)', color:'var(--accent2)',
      title:`Groceries: ${fmtAmt(groceries)} across ${trips} trips`,
      body:`Fewer, larger shopping trips typically reduce impulse buying. Try consolidating to once a week to cut grocery spend by 10–20%.`
    });
  }

  if (sorted.length > 0 && !insights.find(i=>i.title.includes(sorted[0][0]))) insights.push({
    icon:'🎯', bg:'rgba(200,240,96,.07)', color:'var(--accent)',
    title:`Biggest category: ${esc(sorted[0][0])}`,
    body:`<strong class="insight-hi">${fmtAmt(sorted[0][1])}</strong> -- ${(sorted[0][1]/spend*100).toFixed(0)}% of your total spending. Setting a budget limit here will have the most impact.`
  });

  if (!db.income) insights.push({
    icon:'💰', bg:'rgba(200,240,96,.07)', color:'var(--accent)',
    title:'Set your monthly income',
    body:`Go to the <strong class="insight-hi">Budgets tab</strong> and enter your monthly income. SpendLens will show your savings rate and remaining balance.`
  });

  el.innerHTML = `
    <div class="top-bar"><div class="logo">Spend<span>Lens</span></div></div>
    <div class="section-label">${esc(activeMonth)}</div>
    ${insights.map((ins,i)=>`
      <div class="insight-card fade-up" style="animation-delay:${i*.07}s;border-left:3px solid ${ins.color}">
        <div class="insight-icon" style="background:${ins.bg}">${ins.icon}</div>
        <div>
          <div class="insight-title" style="color:${ins.color}">${ins.title}</div>
          <div class="insight-body">${ins.body}</div>
        </div>
      </div>`).join('')}`;
}

    }, 800);
  }
}

// ── INIT ──
if (!activeMonth) {
  document.getElementById('overview-content').innerHTML = uploadZoneHTML();
  initDrop('overview-content');
} else {
  renderOverview();
}
renderMonthBar();
</script>
